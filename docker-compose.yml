version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:4173"
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_APP_NAME=RICH
      - VITE_GOOGLE_MAPS_KEY=${GOOGLE_MAPS_KEY:-}
      - VITE_CESIUMION_KEY=${CESIUMION_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - rich-network

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-tiny}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4173}
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - rich-network

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - rich-network
    profiles:
      - production

  # Redis for caching (Optional)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - rich-network
    profiles:
      - caching

  # Celery Worker for async tasks (Optional)
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery worker --loglevel=info
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    networks:
      - rich-network
    profiles:
      - async

volumes:
  redis-data:

networks:
  rich-network:
    driver: bridge
