name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is affected?
      options:
        - Frontend (React/Vite)
        - Backend (FastAPI)
        - Database (PostgreSQL/PostGIS)
        - AI/ML Pipeline
        - GEV Integration
        - LUMENS Analysis
        - Deployment/Infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (System down, data loss, security)
        - High (Major feature broken)
        - Medium (Feature partially working)
        - Low (Minor issue, cosmetic)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter this bug?
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 14, Windows 11]
        - Browser: [e.g., Chrome 120, Firefox 121, Safari 17]
        - Backend: [e.g., Railway staging, local Docker, local Python]
        - Database: [e.g., Neon staging, local PostgreSQL]
        - Version/Commit: [e.g., v0.1.0, abc1234]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Paste any relevant logs, error messages, or stack traces
      placeholder: |
        ```
        Error: ...
        at ...
        ```
      render: shell
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: Describe the expected behavior...
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information, screenshots, or context
      placeholder: Screenshots, related issues, workarounds tried...
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided all requested information
          required: true