name: CI

# Push CI for direct pushes to the default branch (pull requests are covered by
# pr.yml). Railway is configured to *wait for this check suite* before it
# deploys, and then healthchecks the deployment itself — so this workflow must
# only assert the code is good (tests + build) and must NOT depend on the
# deployment having happened yet. Production verification is in promote.yml.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          APP_ENV: test
        run: |
          cd backend
          pytest tests/ -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck
        run: |
          cd frontend
          npm run lint

      - name: Build
        run: |
          cd frontend
          npm run build

  smoke:
    name: Production smoke test (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TARGET: https://rich-production-d1d3.up.railway.app
    steps:
      - name: Smoke test production
        run: |
          set -e
          curl -sSf "$TARGET/health" >/dev/null
          curl -sSf "$TARGET/api/geospatial/jurisdictions" >/dev/null
          curl -sSf "$TARGET/api/geospatial/parcels?limit=5" >/dev/null
          curl -sSf "$TARGET/impact" >/dev/null
          echo "Production smoke tests passed"
