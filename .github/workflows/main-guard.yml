name: Main branch guard

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: main-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify main arrived via a pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check commit PR association
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! prs="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length' 2>/tmp/gh.err)"; then
            echo "Could not query PR association; skipping guard."
            exit 0
          fi
          if [ "${prs:-0}" -eq 0 ]; then
            echo "::warning::Direct push to main detected: $SHA did not arrive via a pull request."
            exit 0
          else
            echo "OK: $SHA associated with $prs pull request(s)."
          fi

      - name: File process violation issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh issue create --repo "$REPO" \
            --title "Process violation: direct push to main (${SHA:0:7})" \
            --body "A commit was pushed directly to \`main\` without a pull request.\n\nCommit: \`${SHA}\`" \
            --label "process-violation"

      - name: Fail the run
        if: steps.check.outputs.violation == 'true' || failure()
        run: |
          echo "::error::main must only be updated via merged pull requests."
          exit 1