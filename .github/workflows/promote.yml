name: Promote to Production

# Production is deployed automatically by Railway's Git integration on every
# push to master (gated by railway.json watchPatterns). This workflow cuts a
# versioned release and verifies that production is actually serving the
# released commit — it does not need to trigger a deploy itself.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-production
  cancel-in-progress: true

jobs:
  promote:
    name: Release production
    runs-on: ubuntu-latest
    env:
      TARGET: https://rich-production-d1d3.up.railway.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Create Git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -f "${{ inputs.version }}"
          git push origin "${{ inputs.version }}" --force

      - name: Verify production is serving master
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit=""
          for i in $(seq 1 40); do
            commit="$(curl -s "$TARGET/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)"
            echo "attempt $i: deployed commit = ${commit:-<none>}"
            if [ "$commit" = "$SHA" ]; then
              echo "Production is serving $SHA"
              break
            fi
            sleep 15
          done
          if [ "$commit" != "$SHA" ]; then
            echo "::error::Production is not serving $SHA within the timeout."
            exit 1
          fi

      - name: Production smoke tests
        run: |
          set -e
          curl -sSf "$TARGET/health" >/dev/null
          curl -sSf "$TARGET/api/geospatial/jurisdictions" >/dev/null
          curl -sSf "$TARGET/api/geospatial/parcels?limit=5" >/dev/null
          curl -sSf "$TARGET/impact" >/dev/null
          echo "Production smoke tests passed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: |
            Released from `master`.

            - Production: https://rich-production-d1d3.up.railway.app
          draft: false
          prerelease: false
